name: Test and package Linux

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.16'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Install pinned build and runtime dependencies
        run: |
          python -m venv .tools/package-venv
          .tools/package-venv/bin/python -m pip install -r packaging/requirements-build.txt
          .tools/package-venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - name: Unit tests
        # Helm is only an internal reference-chart test tool, never a runtime dependency.
        run: .tools/package-venv/bin/python -m unittest discover -s tests -v
      - name: Build and checksum
        run: .tools/package-venv/bin/python scripts/build_linux.py --tag "$RELEASE_TAG"
      - name: Smoke-test actual executable
        run: |
          version=$(.tools/package-venv/bin/python -c 'from kubeapp import __version__; print(__version__)')
          .tools/package-venv/bin/python scripts/smoke_binary.py "dist/kube-app-${version}-linux-x86_64"
          docker pull ubuntu:22.04
          .tools/package-venv/bin/python scripts/smoke_binary.py "dist/kube-app-${version}-linux-x86_64" --container-image ubuntu:22.04
      - name: Upload tested artifact (not a release)
        uses: actions/upload-artifact@v7
        with:
          name: kube-app-linux-x86_64
          path: |
            dist/kube-app-*-linux-x86_64
            dist/kube-app-*-linux-x86_64.sha256
          if-no-files-found: error
          retention-days: 14
