apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  labels:
    app.kubernetes.io/name: catalog
data:
  APP_ENV: production
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db
  labels:
    app.kubernetes.io/name: catalog
stringData:
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: catalog
  DB_USER: catalog
  DB_PASSWORD: change-me
type: Opaque
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-data
  labels:
    app.kubernetes.io/name: catalog
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: fast
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
    spec:
      containers:
      - name: catalog
        image: registry.example.com/catalog:1.4.2
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: APP_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        envFrom:
        - configMapRef:
            name: catalog-config
        - secretRef:
            name: catalog-db
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: volume-0
          mountPath: /etc/catalog
          readOnly: true
        - name: volume-1
          mountPath: /etc/catalog/secrets
          readOnly: true
        - name: volume-2
          mountPath: /data
      volumes:
      - name: volume-0
        configMap:
          name: catalog-config
      - name: volume-1
        secret:
          secretName: catalog-db
      - name: volume-2
        persistentVolumeClaim:
          claimName: catalog-data
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: catalog
