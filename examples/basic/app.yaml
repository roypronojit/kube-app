name: hello-world

replicas: 2

containers:
  - name: hello-world
    image: nginxinc/nginx-unprivileged:1.27
    imagePullPolicy: IfNotPresent

    ports:
      - name: http
        port: 8080

    resources:
      cpu:
        min: 100m
        max: 500m
      memory:
        min: 128Mi
        max: 256Mi

service:
  port: 80