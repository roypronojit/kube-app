name: catalog

replicas: 3

configuration:
  - name: catalog-config
    file: config/catalog.properties

  - name: catalog-feature-flags
    data:
      FEATURE_NEW_CHECKOUT: "true"
      FEATURE_RECOMMENDATIONS: "false"

secrets:
  - name: catalog-db
    file: secrets/catalog-db.env

  - name: catalog-api
    data:
      API_KEY: ${CATALOG_API_KEY}

storage:
  name: data
  size: 50Gi
  storageClass: fast
  accessModes:
    - ReadWriteOnce

containers:
  - name: catalog
    image: registry.example.com/catalog:1.4.2

    environment:
      APP_ENV: production
      LOG_LEVEL: info

    configuration:
      - name: catalog-config
        as: environment

      - name: catalog-feature-flags
        as: environment

    secrets:
      - name: catalog-db
        as: environment

      - name: catalog-api
        as: environment

    mounts:
      - configuration: catalog-config
        path: /etc/catalog

      - secret: catalog-db
        path: /etc/catalog/secrets

      - storage: data
        path: /data

    resources:
      cpu:
        min: 500m
        max: 2
      memory:
        min: 512Mi
        max: 1Gi

  - name: metrics
    image: registry.example.com/catalog-metrics:1.0

    environment:
      METRICS_PORT: "9090"

    resources:
      cpu:
        min: 50m
        max: 200m
      memory:
        min: 64Mi
        max: 128Mi

init:
  - name: database-migration
    image: registry.example.com/catalog-migrations:1.4.2

    secrets:
      - name: catalog-db
        as: environment

    mounts:
      - storage: data
        path: /data

service:
  type: LoadBalancer
  port: 8080
  container: catalog

serviceAccount: catalog