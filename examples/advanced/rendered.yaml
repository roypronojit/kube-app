apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  labels:
    app.kubernetes.io/name: catalog
data:
  APP_ENV: production
  LOG_LEVEL: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-feature-flags
  labels:
    app.kubernetes.io/name: catalog
data:
  FEATURE_NEW_CHECKOUT: 'true'
  FEATURE_RECOMMENDATIONS: 'false'
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db
  labels:
    app.kubernetes.io/name: catalog
stringData:
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: catalog
  DB_USER: catalog
  DB_PASSWORD: change-me
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api
  labels:
    app.kubernetes.io/name: catalog
stringData:
  API_KEY: example-api-key
type: Opaque
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-data
  labels:
    app.kubernetes.io/name: catalog
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: fast
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
    spec:
      serviceAccountName: catalog
      initContainers:
      - name: database-migration
        image: registry.example.com/catalog-migrations:1.4.2
        envFrom:
        - secretRef:
            name: catalog-db
        volumeMounts:
        - name: volume-0
          mountPath: /data
      containers:
      - name: catalog
        image: registry.example.com/catalog:1.4.2
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: APP_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        envFrom:
        - configMapRef:
            name: catalog-config
        - configMapRef:
            name: catalog-feature-flags
        - secretRef:
            name: catalog-db
        - secretRef:
            name: catalog-api
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: volume-1
          mountPath: /etc/catalog
          readOnly: true
        - name: volume-2
          mountPath: /etc/catalog/secrets
          readOnly: true
        - name: volume-0
          mountPath: /data
      - name: metrics
        image: registry.example.com/catalog-metrics:1.0
        env:
        - name: METRICS_PORT
          value: '9090'
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: volume-0
        persistentVolumeClaim:
          claimName: catalog-data
      - name: volume-1
        configMap:
          name: catalog-config
      - name: volume-2
        secret:
          secretName: catalog-db
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: catalog
